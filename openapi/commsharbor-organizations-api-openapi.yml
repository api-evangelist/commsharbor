  /api/organizations/{organization_id}/billing/purchases/{action}:
    post:
      operationId: commsharbor_billing_purchase
      summary: Request a pass or a top-up.
      description: 'The response is a standard **402 with `accepts[]`** unless `catalog.checkout_live` is true — nobody is charged by accident. The Idempotency-Key makes a retry safe: the same logical purchase never grants entitlement twice.

        Returns: { replayed, state }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
        description: Stable key for this logical purchase. A replay returns the same state and grants nothing extra.
      - name: X-PAYMENT
        in: header
        required: false
        schema:
          type: string
        description: Standard x402 payment payload, when live checkout is explicitly enabled.
      requestBody:
        required: true
        content:
          application/json:
            example: {}
      responses:
        '200':
          description: '{ replayed, state }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  replayed:
                    type: boolean
                    description: True when this key had already been used and nothing new was granted.
                  state:
                    type: object
                    description: 'The entitlement after the request: what is active, what remains, when it expires.'
                required:
                - replayed
                - state
        '400':
          description: Missing Idempotency-Key, or an action other than `pass`/`topup`.
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '402':
          description: Payment required — the body carries `accepts[]`. This is the normal answer while live checkout is disabled.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: The same key was used for a different purchase.
      tags:
      - Organizations
  /api/organizations/{organization_id}/operations:
    get:
      operationId: commsharbor_operations
      summary: List the organization's current operational alerts
      description: 'Covers dead letters, backlog, worker and SNS failures, reputation, paused sending, quota and conservative SES/SNS cost capacity — never with recipient PII.

        Returns: { items }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ items }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                    description: One entry per active alert, with its kind, severity and what to do about it.
                required:
                - items
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
    post:
      operationId: commsharbor_operations_refresh
      summary: Re-observe alerts, quota and global capacity right now
      description: 'The GET reads what was last stored; this goes and looks again. Same distinction as domain verification.

        Returns: { alerts, billing, capacity }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            example: {}
      responses:
        '200':
          description: '{ alerts, billing, capacity }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operations'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/data-exports:
    get:
      operationId: commsharbor_data_exports
      summary: List the tenant data exports, which are retained for seven days
      description: 'Returns: { items[{id,status,expires_at,created_at}] }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ items[{id,status,expires_at,created_at}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDataExport'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
    post:
      operationId: commsharbor_data_export_create
      summary: Create a tenant-scoped JSON export of the organization's data
      description: 'Scoped to one organization by construction: an export can never contain another tenant''s data.

        Returns: { id, status, expires_at, created_at }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            example: {}
      responses:
        '200':
          description: '{ id, status, expires_at, created_at }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/data-exports/{export_id}:
    get:
      operationId: commsharbor_data_export_download
      summary: Download one tenant-scoped JSON export before it expires
      description: 'Returns: `application/json` as an attachment, with the organization''s data.'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: export_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '`application/json` as an attachment, with the organization''s data.'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: The export is not ready yet.
        '410':
          description: It expired after seven days.
      tags:
      - Organizations
  /api/organizations/{organization_id}/deletion-requests:
    get:
      operationId: commsharbor_deletion_request
      summary: Read the latest erasure request and where it is in the grace period
      description: '`status: "none"` means no erasure was ever requested — the resource always answers, so a client never has to interpret a 404 as "nothing scheduled".

        Returns: { id, status, scheduled_for, requested_by }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ id, status, scheduled_for, requested_by }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deletion'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
    post:
      operationId: commsharbor_deletion_schedule
      summary: Schedule the erasure of the organization, after a seven-day grace period
      description: 'The confirmation phrase must be exactly `delete ` — typing the id is the point, so nobody erases the wrong tenant by clicking. After erasure only pseudonymous financial and audit evidence remains.

        Returns: { id, status, scheduled_for, requested_by }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation:
                  type: string
                  description: The exact phrase `delete <organization_id>`.
              required:
              - confirmation
            example:
              confirmation: delete org_…
      responses:
        '200':
          description: '{ id, status, scheduled_for, requested_by }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deletion'
        '400':
          description: The confirmation phrase does not match this organization exactly.
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: An erasure is already scheduled.
      tags:
      - Organizations
  /api/organizations/{organization_id}/deletion-requests/{request_id}/cancel:
    post:
      operationId: commsharbor_deletion_cancel
      summary: Cancel a scheduled erasure while it is still inside the grace period
      description: 'That is what the seven days are for: after they pass, there is nothing left to cancel.

        Returns: { id, status, scheduled_for, requested_by }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: request_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            example: {}
      responses:
        '200':
          description: '{ id, status, scheduled_for, requested_by }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deletion'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: The erasure already ran, or the request was cancelled before.
      tags:
      - Organizations
components:
  schemas:
    CampaignReport:
      type: object
      properties:
        campaign:
          allOf:
          - $ref: '#/components/schemas/Campaign'
          description: The campaign being reported on.
        deliveries:
          type: object
          description: Delivery counts by state.
        events:
          type: object
          description: Normalized feedback counts by event type.
      required:
      - campaign
      - deliveries
      - events
      description: 'Campaign reconciliation: what was delivered and what came back. Counts only — no recipient data.'
    BillingTenant:
      type: object
      properties:
        catalog:
          allOf:
          - $ref: '#/components/schemas/BillingCatalog'
          description: Plans and prices in force.
        state:
          type: object
          description: 'Current entitlement: what is active, how many sends remain and when it expires.'
        warning:
          type: object
          description: Expiration or exhaustion warning, when one applies.
          nullable: true
        payment:
          allOf:
          - $ref: '#/components/schemas/PlanoX402'
          description: x402 configuration for paying.
      required:
      - catalog
      - state
      - warning
      - payment
      description: What THIS organization is entitled to, and how close it is to running out.
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          description: Event ID.
        action:
          type: string
          description: What happened, e.g. `api_key.created`.
        actor_user_id:
          type: string
          description: Who did it; null when the actor was a key or the system.
          nullable: true
        target:
          type: string
          description: What it happened to.
          nullable: true
        metadata:
          type: object
          description: Extra context for this action. Never contains recipient PII.
        created_at:
          type: string
          description: When it happened (UTC).
      required:
      - id
      - action
      - actor_user_id
      - target
      - metadata
      - created_at
      description: One append-only record of something that happened in the organization. Audit is never rewritten.
    ImportError:
      type: object
      properties:
        row:
          type: integer
          description: 1-based row number in the uploaded CSV.
        code:
          type: string
          description: Why it was rejected, e.g. `invalid_email`.
        message:
          type: string
          description: The reason in a sentence.
      required:
      - row
      - code
      - message
      description: One rejected row, addressed by line number so it can be fixed in the source file.
    Contact:
      type: object
      properties:
        id:
          type: string
          description: Contact ID.
        email:
          type: string
          description: Email address, normalized and never truncated.
        first_name:
          type: string
          description: Given name.
          nullable: true
        last_name:
          type: string
          description: Family name.
          nullable: true
        company_id:
          type: string
          description: Company this contact belongs to.
          nullable: true
        created_at:
          type: string
          description: Creation time (UTC).
        updated_at:
          type: string
          description: Last change (UTC).
          nullable: true
        url:
          type: string
          description: Absolute URL of this contact — agents never build the path by hand.
      required:
      - id
      - email
      - first_name
      - last_name
      - company_id
      - created_at
      - updated_at
      - url
      description: A person in the tenant CRM. Marketing consent is a separate resource — being in the CRM is not permission to email.
    Provisioning:
      type: object
      properties:
        queued:
          type: boolean
          description: Whether this call enqueued provisioning work.
        job_id:
          type: string
          description: The provisioning job, when one was created.
          nullable: true
      required:
      - queued
      - job_id
      description: The idempotent SES provisioning queued for a domain. Asking twice does not provision twice.
    PageAudience:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Audience'
          description: The records on this page.
        next_cursor:
          type: string
          description: Cursor for the next page; null when there are no more.
          nullable: true
      required:
      - items
      - next_cursor
      description: Cursor-paginated listing. A null cursor means this was the last page.
    MessagingSettings:
      type: object
      properties:
        timezone:
          type: string
          description: IANA timezone used to schedule campaigns, e.g. `America/Sao_Paulo`.
        marketing_state:
          type: string
          description: Whether marketing may go out.
        paused_reason:
          type: string
          description: Why marketing was paused, when it was.
          nullable: true
      required:
      - timezone
      - marketing_state
      - paused_reason
      description: Timezone and marketing pause state. A reputation or SES tenant risk pauses marketing automatically, and resuming requires a healthy observation first.
    PageCompany:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Company'
          description: The records on this page.
        next_cursor:
          type: string
          description: Cursor for the next page; null when there are no more.
          nullable: true
      required:
      - items
      - next_cursor
      description: Cursor-paginated listing. A null cursor means this was the last page.
    ApiKey:
      type: object
      properties:
        id:
          type: string
          description: API key ID, used to revoke it.
        name:
          type: string
          description: Label chosen at creation.
        scopes:
          type: array
          items:
            type: string
          description: What this key may do, e.g. `crm:read`, `messages:send`.
        prefix:
          type: string
          description: Token prefix, so a key can be recognised in a list.
        last_used_at:
          type: string
          description: When the key last answered; null if never.
          nullable: true
        revoked_at:
          type: string
          description: When it was revoked; null while it is still valid.
          nullable: true
        created_at:
          type: string
          description: Creation time (UTC).
        token:
          type: string
          description: The key itself. Present only on the response that created it — it is never shown again.
      required:
      - id
      - name
      - scopes
      - prefix
      - last_used_at
      - revoked_at
      - created_at
      description: A scoped machine credential. It determines its own organization and rejects a conflicting header.
    BillingCatalog:
      type: object
      properties:
        version:
          type: string
          description: Catalog version, so a client can tell prices changed.
        trial:
          type: object
          description: What a new organization gets for free.
        pass:
          type: object
          description: 'The paid pass: what it grants and what it costs.'
        topup:
          type: object
          description: 'One-off send top-up: size and price.'
        checkout_live:
          type: boolean
          description: Whether live checkout is enabled. While false, a purchase returns an x402 challenge.
        global_recipient_hard_cap:
          type: integer
          description: Real recipients per month across the whole platform. This always prevails.
        auto_renew:
          type: boolean
          description: Always false — nothing here renews by itself.
      required:
      - version
      - trial
      - pass
      - topup
      - checkout_live
      - global_recipient_hard_cap
      - auto_renew
      description: Plans and prices, versioned. Nothing here auto-renews — a pass or a top-up is bought once and runs out.
    Capacity:
      type: object
      properties:
        remaining:
          type: integer
          description: Sends still available to this organization.
        global_remaining:
          type: integer
          description: Sends still available across the whole platform this month.
        hard_cap:
          type: integer
          description: The global monthly cap on real recipients. Nothing raises it.
      required:
      - remaining
      - global_remaining
      - hard_cap
      description: What is left to send. The bootstrap global cap always prevails over any tenant allowance.
    Dispatch:
      type: object
      properties:
        queued:
          type: boolean
          description: Whether a Queue message was produced.
        job_id:
          type: string
          description: Dispatch job ID, when one was created.
          nullable: true
      required:
      - queued
      - job_id
      description: What actually happened to the queue message behind this send.
    Task:
      type: object
      properties:
        id:
          type: string
          description: Task ID.
        title:
          type: string
          description: What has to be done.
        status:
          type: string
          description: Current state.
        due_at:
          type: string
          description: When it is due (UTC).
          nullable: true
        assignee_user_id:
          type: string
          description: Member responsible for it.
          nullable: true
        deal_id:
          type: string
          description: Deal the task belongs to.
          nullable: true
        contact_id:
          type: string
          description: Contact the task belongs to.
          nullable: true
        created_at:
          type: string
          description: Creation time (UTC).
        updated_at:
          type: string
          description: Last change (UTC).
          nullable: true
        url:
          type: string
          description: Absolute URL of this task.
      required:
      - id
      - title
      - status
      - due_at
      - assignee_user_id
      - deal_id
      - contact_id
      - created_at
      - updated_at
      - url
      description: Work someone still has to do, inside the tenant CRM.
    ListaDataExport:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataExport'
          description: Every record in the collection.
      required:
      - items
      description: A complete, unpaginated collection — used where the set is bounded by design.
    ListaDelivery:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
          description: Every record in the collection.
      required:
      - items
      description: A complete, unpaginated collection — used where the set is bounded by design.
    Company:
      type: object
      properties:
        id:
          type: string
          description: Company ID.
        name:
          type: string
          description: Company name.
        domain:
          type: string
          description: Primary domain.
          nullable: true
        website:
          type: string
          description: Website URL.
          nullable: true
        created_at:
          type: string
          description: Creation time (UTC).
        updated_at:
          type: string
          description: Last change (UTC).
          nullable: true
        url:
          type: string
          description: Absolute URL of this company.
      required:
      - id
      - name
      - domain
      - website
      - created_at
      - updated_at
      - url
      description: An organization in the tenant CRM — a customer of the customer, not a tenant of this product.
    DataExport:
      type: object
      properties:
        id:
          type: string
          description: Export ID.
        status:
          type: string
          description: Where the export stands.
        expires_at:
          type: string
          description: When the file is deleted (UTC).
        created_at:
          type: string
          description: Creation time (UTC).
      required:
      - id
      - status
      - expires_at
      - created_at
      description: A tenant-scoped JSON export, retained for seven days.
    Deal:
      type: object
      properties:
        id:
          type: string
          description: Deal ID.
        title:
          type: string
          description: What the deal is.
        pipeline_id:
          type: string
          description: Pipeline the deal lives in.
        stage_id:
          type: string
          description: Current stage.
        status:
          type: string
          description: Where it stands.
        value_minor:
          type: integer
          description: Value in the currency's minor unit — cents, not dollars.
          nullable: true
        currency:
          type: string
          description: ISO 4217 code for `value_minor`.
          nullable: true
        contact_id:
          type: string
          description: Main contact on the deal.
          nullable: true
        company_id:
          type: string
          description: Company on the deal.
          nullable: true
        created_at:
          type: string
          description: Creation time (UTC).
        updated_at:
          type: string
          description: Last change (UTC).
          nullable: true
        url:
          type: string
          description: Absolute URL of this deal.
      required:
      - id
      - title
      - pipeline_id
      - stage_id
      - status
      - value_minor
      - currency
      - contact_id
      - company_id
      - created_at
      - updated_at
      - url
      description: An opportunity moving through a pipeline. Money is stored in minor units to avoid float rounding.
    ListaWebhook:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
          description: Every record in the collection.
      required:
      - items
      description: A complete, unpaginated collection — used where the set is bounded by design.
    Campaign:
      type: object
      properties:
        id:
          type: string
          description: Campaign ID.
        name:
          type: string
          description: Campaign name.
        status:
          type: string
          description: Where the campaign is.
        domain_id:
          type: string
          description: Domain it sends from.
        audience_id:
          type: string
          description: Audience it goes to.
        template_id:
          type: string
          description: Published marketing template used.
        template_version:
          type: integer
          description: Frozen template version.
        scheduled_for:
          type: string
          description: When it is scheduled, in the organization's timezone.
          nullable: true
        frozen_recipients:
          type: integer
          description: How many recipients were frozen at launch.
          nullable: true
        created_at:
          type: string
          description: Creation time (UTC).
      required:
      - id
      - name
      - status
      - domain_id
      - audience_id
      - template_id
      - template_version
      - scheduled_for
      - frozen_recipients
      - created_at
      description: A marketing send to an audience. Launching freezes the eligible recipients exactly once — the frozen set is what gets sent, no matter what changes afterwards.
    Organization:
      type: object
      properties:
        id:
          type: string
          description: Organization ID, used in every tenant route.
        name:
          type: string
          description: Display name.
        sending_domain:
          type: string
          description: Domain the organization sends from.
          nullable: true
        created_at:
          type: string
          description: Creation time (UTC, ISO-8601).
      required:
      - id
      - name
      - sending_domain
      - created_at
      description: A tenant. Every piece of customer data in this product is scoped to exactly one.
    PageCamelTemplate:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Template'
          description: The records on this page.
        nextCursor:
          type: string
          description: Cursor for the next page; null when there are no more.
          nullable: true
      required:
      - items
      - nextCursor
      description: The same listing with the cursor in camelCase. Older resources ship it this way and the name is kept because changing it would break clients already reading it.
    Webhook:
      type: object
      properties:
        id:
          type: string
          description: Webhook ID.
        url:
          type: string
          description: HTTPS destination.
        event_types:
          type: array
          items:
            type: string
          description: Which events are delivered to it.
        status:
          type: string
          description: Whether it is receiving.
        created_at:
          type: string
          description: Creation time (UTC).
        secret:
          type: string
          description: Signing secret for timestamped HMAC-SHA256. Present only on the response that created it.
      required:
      - id
      - url
      - event_types
      - status
      - created_at
      description: An HTTPS endpoint that receives delivery events. The signing secret is revealed once, at creation.
    PageImportError:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportError'
          description: The records on this page.
        next_cursor:
          type: string
          description: Cursor for the next page; null when there are no more.
          nullable: true
      required:
      - items
      - next_cursor
      description: Cursor-paginated listing. A null cursor means this was the last page.
    Suppression:
      type: object
      properties:
        id:
          type: string
          description: Suppression ID.
        scope:
          type: string
          description: How far it reaches.
        reason:
          type: string
          description: Why it exists, e.g. `bounce`, `complaint`, `manual`.
        contact_id:
          type: string
          description: CRM contact it matches, when known.
          nullable: true
        created_at:
          type: string
