    post:
      operationId: commsharbor_contact_import_preview
      summary: Upload a consent-declared CSV and get back a safe preview before anything is…
      description: 'Nothing is created by this call. The consent declaration is mandatory: an import that cannot say why these people may be emailed is an import that does not happen.

        Returns: { import{id,status,rows,accepted,rejected,basis,file_id,created_at}, preview, errors[{row,code,message}] }'
