    ListaDeliveryEvent:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryEvent'
          description: Every record in the collection.
      required:
      - items
      description: A complete, unpaginated collection — used where the set is bounded by design.
    DeliveryEvent:
      type: object
      properties:
        id:
          type: string
          description: Event ID.
        event_type:
          type: string
          description: What SES reported.
        occurred_at:
          type: string
          description: When SES says it happened (UTC).
        detail:
          type: object
          description: Normalized detail for this event type, without recipient PII.
      required:
      - id
      - event_type
      - occurred_at
      - detail
      description: A normalized SES feedback event. Open and Click are ADDITIVE — they never overwrite delivery state.
    PlanoX402:
      type: object
      properties:
        provider:
          type: string
          description: Always `x402` — the only billing protocol accepted.
        mode:
          type: string
          description: 'Seller mode: `live` charges for real, `dev` lets calls through unpaid.'
        network:
          type: string
          description: 'USDC network: `base` in production, `base-sepolia` in staging.'
        chain_id:
          type: integer
          description: EVM chain ID of the network above, so the wallet signs on the right chain.
        pay_to:
          type: string
          description: Address that receives the payment.
          nullable: true
        homolog:
          type: boolean
          description: 'Staging seam on: the loop can be closed without spending USDC.'
        dev:
          type: boolean
          description: 'Development mode: the 402 is simulated.'
        dev_gate:
          type: string
          description: How dev mode is unlocked, when it exists.
          nullable: true
        facilitator:
          type: string
          description: URL of the facilitator that verifies and settles the payment.
        asset:
          type: string
          description: Accepted currency — always `USDC`.
        asset_address:
          type: string
          description: USDC contract on the network above.
        faucet:
          type: string
          description: Test-USDC faucet; only on base-sepolia.
          nullable: true
        wallets:
          type: object
          description: Links to wallets that speak x402 (metamask, coinbase, base_app).
      required:
      - provider
      - mode
      - network
      - chain_id
      - pay_to
      - homolog
      - dev
      - dev_gate
      - facilitator
      - asset
      - asset_address
      - faucet
      - wallets
      description: x402 payment configuration in force. Comes from `planPublic` and is the same across the products.
    Deletion:
      type: object
      properties:
        id:
          type: string
          description: Deletion request ID.
          nullable: true
        status:
          type: string
          description: Where the request stands.
        scheduled_for:
          type: string
          description: When erasure runs, after the grace period (UTC).
          nullable: true
        requested_by:
          type: string
          description: Who scheduled it.
          nullable: true
      required:
      - id
      - status
      - scheduled_for
      - requested_by
      description: A scheduled tenant erasure. It waits seven days, and what survives is pseudonymous financial and audit evidence only.
    Invitation:
      type: object
      properties:
        id:
          type: string
          description: Invitation ID.
        email:
          type: string
          description: Who is being invited.
        role:
          type: string
          description: Role the invitation grants.
        expires_at:
          type: string
          description: When the invitation stops working (UTC).
        invitation_token:
          type: string
          description: The invitation token. Present only on the response that created it.
        token_notice:
          type: string
          description: Reminder that the token is shown once.
      required:
      - id
      - email
      - role
      - expires_at
      description: An invitation into an existing organization. The token is revealed once, at creation, and never listed again.
    ListaTemplateVersion:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateVersion'
          description: Every record in the collection.
      required:
      - items
      description: A complete, unpaginated collection — used where the set is bounded by design.
    Marketing:
      type: object
      properties:
        marketing_enabled:
          type: boolean
          description: Whether marketing may be sent to this contact right now.
        basis:
          type: string
          description: Why sending is allowed.
          nullable: true
        source:
          type: string
          description: Where the consent came from, e.g. a signup form.
          nullable: true
        captured_at:
          type: string
          description: When consent was captured (UTC).
          nullable: true
        unsubscribed_at:
          type: string
          description: When the contact unsubscribed; null when they never did.
          nullable: true
      required:
      - marketing_enabled
      - basis
      - source
      - captured_at
      - unsubscribed_at
      description: Consent and preference for one contact. Recording consent NEVER restores a previous unsubscribe — that asymmetry is the point.
    Stage:
      type: object
      properties:
        id:
          type: string
          description: Stage ID.
        pipeline_id:
          type: string
          description: Pipeline this stage belongs to.
        name:
          type: string
          description: Stage name, e.g. `Proposal`.
        position:
          type: integer
          description: Order within the pipeline, lowest first.
        probability:
          type: integer
          description: Chance of winning at this stage, 0 to 100.
          nullable: true
        url:
          type: string
          description: Absolute URL of this stage.
