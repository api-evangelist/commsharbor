openapi: 3.2.0
info:
  title: CommsHarbor Organizations API
  version: 2d690e87
  description: CommsHarbor API. Organization identity is explicit and tenant-scoped.
servers:
- url: https://commsharbor.com
tags:
- name: Organizations
paths:
  /api/organizations:
    get:
      operationId: commsharbor_organizations
      summary: List the organizations the current person belongs to
      description: 'Returns: { organizations[{id,name,sending_domain,created_at}] }'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: '{ organizations[{id,name,sending_domain,created_at}] }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                    description: Every organization with a membership for this person.
                required:
                - organizations
        '401':
          description: No session, or the session expired.
      tags:
      - Organizations
    post:
      operationId: commsharbor_organization_create
      summary: Create one organization trial for a verified owner and a sending domain
      description: 'One trial per owner. The domain is registered here but not verified — DNS state is only ever observed, in the domains resource.

        Returns: { id, name, sending_domain, created_at }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name of the organization.
                sending_domain:
                  type: string
                  description: Domain the organization will send from.
              required:
              - name
              - sending_domain
            example:
              name: Acme
              sending_domain: example.com
      responses:
        '200':
          description: '{ id, name, sending_domain, created_at }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Missing name or domain.
        '401':
          description: No session, or the session expired.
        '409':
          description: This owner already has a trial organization.
      tags:
      - Organizations
  /api/organizations/{organization_id}:
    get:
      operationId: commsharbor_organization_get
      summary: Read one organization
      description: 'Returns: { id, name, sending_domain, created_at }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ id, name, sending_domain, created_at }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
    patch:
      operationId: commsharbor_organization_update
      summary: Update an organization's name
      description: 'Returns: { id, name, sending_domain, created_at }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New display name.
              required:
              - name
            example:
              name: Acme Global
      responses:
        '200':
          description: '{ id, name, sending_domain, created_at }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Empty name.
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/members:
    get:
      operationId: commsharbor_members
      summary: List the members of an organization and their roles
      description: 'Returns: { members[{organization_id,user_id,role,created_at}] }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ members[{organization_id,user_id,role,created_at}] }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
                    description: Every member and the role they hold.
                required:
                - members
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/members/{user_id}:
    patch:
      operationId: commsharbor_member_role
      summary: Change the role of a member who is not the owner
      description: 'The owner''s role cannot be changed through this route — an organization that can lose its last owner is an organization nobody can administer.

        Returns: { organization_id, user_id, role, created_at }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: Role to give the member from now on.
              required:
              - role
            example:
              role: marketer
      responses:
        '200':
          description: '{ organization_id, user_id, role, created_at }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          description: Unknown role.
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/invitations:
    get:
      operationId: commsharbor_invitations
      summary: List invitations without their tokens
      description: 'The token is shown once, when the invitation is created. Listing never shows it again.

        Returns: { invitations[{id,email,role,expires_at,invitation_token?,token_notice?}] }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ invitations[{id,email,role,expires_at,invitation_token?,token_notice?}] }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
                    description: Invitations for this organization, without tokens.
                required:
                - invitations
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
    post:
      operationId: commsharbor_invitation_create
      summary: Create an invitation and reveal its token exactly once
      description: 'Store the token now: this is the only response that carries it.

        Returns: { id, email, role, expires_at, invitation_token?, token_notice? }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Who to invite.
                role:
                  type: string
                  description: Role the invitation grants.
              required:
              - email
              - role
            example:
              email: member@example.com
              role: viewer
      responses:
        '200':
          description: '{ id, email, role, expires_at, invitation_token?, token_notice? }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          description: Missing email or unknown role.
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/api-keys:
    get:
      operationId: commsharbor_api_keys
      summary: List API keys without token hashes or secrets
      description: 'Returns: { api_keys[{id,name,scopes,prefix,last_used_at,revoked_at,created_at,token?}] }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ api_keys[{id,name,scopes,prefix,last_used_at,revoked_at,created_at,token?}] }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                    description: Keys of this organization, without the tokens.
                required:
                - api_keys
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
    post:
      operationId: commsharbor_api_key_create
      summary: Create a scoped API key and reveal it exactly once
      description: 'The key determines its own organization. It cannot manage credentials or membership — those stay with human admins.

        Returns: { id, name, scopes, prefix, last_used_at, revoked_at, created_at, token? }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Label so the key can be recognised later.
                scopes:
                  type: array
                  items:
                    type: string
                  description: What the key may do, e.g. `organization:read`, `crm:write`, `messages:send`.
              required:
              - name
              - scopes
            example:
              name: Automation
              scopes:
              - organization:read
              - crm:read
              - crm:write
      responses:
        '200':
          description: '{ id, name, scopes, prefix, last_used_at, revoked_at, created_at, token? }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '400':
          description: Missing name or unknown scope.
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/api-keys/{api_key_id}:
    delete:
      operationId: commsharbor_api_key_revoke
      summary: Revoke an API key. It stops working immediately, not at the next cache expiry
      description: 'Returns: { id, name, scopes, prefix, last_used_at, revoked_at, created_at, token? }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: api_key_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ id, name, scopes, prefix, last_used_at, revoked_at, created_at, token? }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/audit:
    get:
      operationId: commsharbor_audit
      summary: List the append-only audit trail of the organization
      description: 'Audit records are never rewritten and never carry recipient PII.

        Returns: { items[{id,action,actor_user_id,target,metadata,created_at}], nextCursor }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from the previous page. Do not build or parse it.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: Page size, from 1 to 100.
      responses:
        '200':
          description: '{ items[{id,action,actor_user_id,target,metadata,created_at}], nextCursor }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCamelAuditEvent'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/domains:
    get:
      operationId: commsharbor_domains
      summary: List the sending domains of the organization and their last observed state
      description: '`status` is what was last OBSERVED at SES and DNS. It does not become `active` because provisioning was requested.

        Returns: { items[{id,domain,status,dkim_tokens,dmarc,mail_from,last_observed_at,created_at}] }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ items[{id,domain,status,dkim_tokens,dmarc,mail_from,last_observed_at,created_at}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDomain'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
    post:
      operationId: commsharbor_domain_create
      summary: Register the organization's sending domain and queue idempotent SES provisioning
      description: 'Asking twice does not provision twice. Publish the returned DKIM records, then call `verify` to have the state observed.

        Returns: { domain{id,domain,status,dkim_tokens,dmarc,mail_from,last_observed_at,created_at}, provisioning{queued,job_id} }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  description: The domain to send from, e.g. `example.com`.
              required:
              - domain
            example:
              domain: example.com
      responses:
        '200':
          description: '{ domain{id,domain,status,dkim_tokens,dmarc,mail_from,last_observed_at,created_at}, provisioning{queued,job_id} }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    allOf:
                    - $ref: '#/components/schemas/Domain'
                    description: The registered domain, with the DKIM records to publish.
                  provisioning:
                    allOf:
                    - $ref: '#/components/schemas/Provisioning'
                    description: Whether this call enqueued provisioning work.
                required:
                - domain
                - provisioning
        '400':
          description: Missing or malformed domain.
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/domains/{domain_id}:
    get:
      operationId: commsharbor_domain_get
      summary: Read one sending domain, without inferring current DNS state
      description: 'This returns what was stored at the last observation. To look again, call `verify`.

        Returns: { id, domain, status, dkim_tokens, dmarc, mail_from, last_observed_at, created_at }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: domain_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ id, domain, status, dkim_tokens, dmarc, mail_from, last_observed_at, created_at }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/domains/{domain_id}/verify:
    post:
      operationId: commsharbor_domain_verify
      summary: Observe SES, DKIM, DMARC and custom MAIL FROM state right now, and store what…
      description: 'This is the ONLY operation that can move a domain to `active`, and only because it actually looked.

        Returns: { id, domain, status, dkim_tokens, dmarc, mail_from, last_observed_at, created_at }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: domain_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            example: {}
      responses:
        '200':
          description: '{ id, domain, status, dkim_tokens, dmarc, mail_from, last_observed_at, created_at }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/domains/{domain_id}/smoke:
    post:
      operationId: commsharbor_domain_smoke
      summary: Queue one controlled smoke message to the server-side QA recipient
      description: 'The request never accepts a recipient: the destination is a server-side secret. That is what keeps this from becoming a way to send mail to arbitrary addresses through someone else''s verified domain.

        Returns: { delivery{id,status,domain_id,template_id,template_version,ses_message_id,created_at}, capacity{remaining,global_remaining,hard_cap}, dispatch{queued,job_id} }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: domain_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            example: {}
      responses:
        '200':
          description: '{ delivery{id,status,domain_id,template_id,template_version,ses_message_id,created_at}, capacity{remaining,global_remaining,hard_cap}, dispatch{queued,job_id} }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery:
                    allOf:
                    - $ref: '#/components/schemas/Delivery'
                    description: The delivery record for the smoke.
                  capacity:
                    allOf:
                    - $ref: '#/components/schemas/Capacity'
                    description: What is left to send after it.
                  dispatch:
                    allOf:
                    - $ref: '#/components/schemas/Dispatch'
                    description: The queue work behind it.
                required:
                - delivery
                - capacity
                - dispatch
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: The domain is not active yet — verify it first.
        '429':
          description: No capacity left.
      tags:
      - Organizations
  /api/organizations/{organization_id}/domains/{domain_id}/deliveries:
    get:
      operationId: commsharbor_domain_deliveries
      summary: List deliveries sent from one domain, without recipient addresses
      description: 'Returns: { items[{id,status,domain_id,template_id,template_version,ses_message_id,created_at}] }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: domain_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ items[{id,status,domain_id,template_id,template_version,ses_message_id,created_at}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDelivery'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/deliveries/{delivery_id}:
    get:
      operationId: commsharbor_delivery_get
      summary: Read one delivery and its SES MessageId, without recipient data
      description: '`ses_message_id` is what correlates this record with AWS when you need to chase a message there.

        Returns: { id, status, domain_id, template_id, template_version, ses_message_id, created_at }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ id, status, domain_id, template_id, template_version, ses_message_id, created_at }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Organizations
  /api/organizations/{organization_id}/deliveries/{delivery_id}/events:
    get:
      operationId: commsharbor_delivery_events
      summary: List the normalized SES feedback events for one delivery
      description: 'Open and Click are ADDITIVE: they are recorded alongside delivery state and never overwrite it.

        Returns: { items[{id,event_type,occurred_at,detail}] }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{ items[{id,event_type,occurred_at,detail}] }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeliveryEvent'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
