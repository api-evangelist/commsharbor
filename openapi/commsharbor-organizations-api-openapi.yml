openapi: 3.2.0
info:
  title: CommsHarbor Organizations API
  version: 1d751aaf
  description: Manage domain email, mailboxes, aliases and durable jobs. Each call uses its organization's identity.
servers:
- url: https://commsharbor.com
tags:
- name: Organizations
paths:
  /api/organizations/{organization_id}:
    get:
      operationId: commsharbor_organization_get
      summary: 'Open one organization: its name, your role and its CommsHarbor plan'
      description: 'This is how a workspace is opened. Name and role come from the shared account (null with an organization API key, which carries neither); the plan is the organization''s global entitlement in CommsHarbor.

        Returns: { id, name, role, email_workspace }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Active organization ID (the organization's id in the shared account). It must match `X-Organization-Id`.
        example: $ORG
      - name: X-Organization-Id
        in: header
        required: true
        schema:
          type: string
        description: 'Which organization to act in; required with a session. The shared account checks, on every request, that you belong to it and that CommsHarbor is enabled for it. An organization API key opens only its own organization: send that ID, or omit the header.'
      responses:
        '200':
          description: '{ id, name, role, email_workspace }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: No signed-in session, or the API key is invalid or revoked (`invalid_api_key`); an old `ch_…` key answers `api_key_retired`.
        '403':
          description: The session or key lacks the permission this operation needs (an API key never reaches billing, erasure, exports or the audit trail), an account key was used where an organization key is needed (`organization_key_required`), or an owner/admin has no second factor (`organization_mfa_required`).
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '503':
          description: The shared account is unavailable.
      tags:
      - Organizations
  /api/organizations/{organization_id}/audit:
    get:
      operationId: commsharbor_audit
      summary: List the append-only audit trail of the organization
      description: 'Audit records are never rewritten and never carry recipient PII.

        Returns: { items[{id,action,actor_user_id,target,metadata,created_at}], nextCursor }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Active organization ID (the organization's id in the shared account). It must match `X-Organization-Id`.
        example: $ORG
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from the previous page. Do not build or parse it.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: Page size, from 1 to 100.
      responses:
        '200':
          description: '{ items[{id,action,actor_user_id,target,metadata,created_at}], nextCursor }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCamelAuditEvent'
        '401':
          description: No signed-in session, or the API key is invalid or revoked (`invalid_api_key`); an old `ch_…` key answers `api_key_retired`.
        '403':
          description: The session or key lacks the permission this operation needs (an API key never reaches billing, erasure, exports or the audit trail), an account key was used where an organization key is needed (`organization_key_required`), or an owner/admin has no second factor (`organization_mfa_required`).
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '503':
          description: The shared account is unavailable.
      tags:
      - Organizations
  /api/organizations/{organization_id}/email/domain-import/{service}:
    get:
      operationId: commsharbor_email_google_catalog
      summary: Read authorized Google metadata. This does not prove DNS ownership
      description: 'Requires an account session in this organization. Reads site metadata only. Google access and refresh tokens remain encrypted on the server. This does not change DNS, buy a subscription or grant another product access to Google data.

        Returns: { connected, domains, groups?, resolved?, available? }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID. Must match X-Organization-Id.
        example: $ORG
      - name: service
        in: path
        required: true
        schema:
          type: string
        description: search_console or analytics. Each connection has its own consent.
        example: search_console
      responses:
        '200':
          description: '{ connected, domains, groups?, resolved?, available? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                    description: This identity has a saved connection for this product and service.
                  domains:
                    type: array
                    items:
                      type: object
                    description: Distinct domain names from authorized properties or selected Analytics web streams.
                  groups:
                    type: array
                    items:
                      type: object
                    description: Analytics accounts and properties. No reports are read.
                  resolved:
                    type: boolean
                    description: Selected Analytics properties have been resolved to domains.
                  available:
                    type: boolean
                    description: Google client configuration is available. This does not assert consent or verification approval.
                required:
                - connected
                - domains
        '401':
          description: Account session required. Organization keys cannot access personal Google connections.
        '403':
          description: Write requires an owner or admin, the same Origin and valid CSRF.
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: Google connection required or changed.
        '503':
          description: Google import unavailable. Retry or use account/manual domain registration.
      tags:
      - Organizations
  /api/organizations/{organization_id}/email/domain-import/{service}/connect:
    post:
      operationId: commsharbor_email_google_connect
      summary: Start five-minute Google consent with PKCE. Return an authorization URL.
      description: 'Requires an account session in this organization. Reads site metadata only. Google access and refresh tokens remain encrypted on the server. This does not change DNS, buy a subscription or grant another product access to Google data.

        Returns: { redirect }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID. Must match X-Organization-Id.
        example: $ORG
      - name: service
        in: path
        required: true
        schema:
          type: string
        description: search_console or analytics. Each connection has its own consent.
        example: search_console
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  description: Consent return language.
                  enum:
                  - en
                  - pt
      responses:
        '200':
          description: '{ redirect }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect:
                    type: string
                    description: Google consent URL. The owner must approve it in a browser.
                required:
                - redirect
        '401':
          description: Account session required. Organization keys cannot access personal Google connections.
        '403':
          description: Write requires an owner or admin, the same Origin and valid CSRF.
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: Google connection required or changed.
        '503':
          description: Google import unavailable. Retry or use account/manual domain registration.
      tags:
      - Organizations
  /api/organizations/{organization_id}/email/domain-import/{service}/resolve:
    post:
      operationId: commsharbor_email_google_resolve
      summary: Resolve website addresses for up to 20 selected Analytics properties.
      description: 'Requires an account session in this organization. Reads site metadata only. Google access and refresh tokens remain encrypted on the server. This does not change DNS, buy a subscription or grant another product access to Google data.

        Returns: { connected, domains, groups?, resolved?, available? }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID. Must match X-Organization-Id.
        example: $ORG
      - name: service
        in: path
        required: true
        schema:
          type: string
        description: search_console or analytics. Each connection has its own consent.
        example: analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  type: object
                  description: Authorized properties/ID values from the catalog, at most 20 unique entries.
              required:
              - properties
      responses:
        '200':
          description: '{ connected, domains, groups?, resolved?, available? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                    description: This identity has a saved connection for this product and service.
                  domains:
                    type: array
                    items:
                      type: object
                    description: Distinct domain names from authorized properties or selected Analytics web streams.
                  groups:
                    type: array
                    items:
                      type: object
                    description: Analytics accounts and properties. No reports are read.
                  resolved:
                    type: boolean
                    description: Selected Analytics properties have been resolved to domains.
                  available:
                    type: boolean
                    description: Google client configuration is available. This does not assert consent or verification approval.
                required:
                - connected
                - domains
        '401':
          description: Account session required. Organization keys cannot access personal Google connections.
        '403':
          description: Write requires an owner or admin, the same Origin and valid CSRF.
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: Google connection required or changed.
        '503':
          description: Google import unavailable. Retry or use account/manual domain registration.
      tags:
      - Organizations
  /api/organizations/{organization_id}/email/domain-import/{service}/disconnect:
    post:
      operationId: commsharbor_email_google_disconnect
      summary: Remove this product's saved Google connection and pending consent.
      description: 'Requires an account session in this organization. Reads site metadata only. Google access and refresh tokens remain encrypted on the server. This does not change DNS, buy a subscription or grant another product access to Google data.

        Returns: { connected, domains, groups?, resolved?, available? }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID. Must match X-Organization-Id.
        example: $ORG
      - name: service
        in: path
        required: true
        schema:
          type: string
        description: search_console or analytics. Each connection has its own consent.
        example: search_console
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: '{ connected, domains, groups?, resolved?, available? }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                    description: This identity has a saved connection for this product and service.
                  domains:
                    type: array
                    items:
                      type: object
                    description: Distinct domain names from authorized properties or selected Analytics web streams.
                  groups:
                    type: array
                    items:
                      type: object
                    description: Analytics accounts and properties. No reports are read.
                  resolved:
                    type: boolean
                    description: Selected Analytics properties have been resolved to domains.
                  available:
                    type: boolean
                    description: Google client configuration is available. This does not assert consent or verification approval.
                required:
                - connected
                - domains
        '401':
          description: Account session required. Organization keys cannot access personal Google connections.
        '403':
          description: Write requires an owner or admin, the same Origin and valid CSRF.
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: Google connection required or changed.
        '503':
          description: Google import unavailable. Retry or use account/manual domain registration.
      tags:
      - Organizations
  /api/organizations/{organization_id}/email/domains/{resource_id}/products:
    get:
      operationId: commsharbor_email_domain_products_list
      summary: Read services associated with this exact domain
      description: 'The private email backend confirms domain ownership in this organization. Selected native products must already be enabled. Association is idempotent. It does not create a PageAudit project, HookPulse monitor or paid subscription.

        Returns: { services }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID. Must match X-Organization-Id.
        example: $ORG
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
        description: Domain ID in the caller's email organization.
        example: $DOMAIN
      responses:
        '200':
          description: '{ services }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: string
                    description: Associated services with native organization access still enabled.
                required:
                - services
        '400':
          description: Invalid or duplicate service.
        '401':
          description: No signed-in session, or the API key is invalid or revoked (`invalid_api_key`); an old `ch_…` key answers `api_key_retired`.
        '403':
          description: The session or key lacks the permission this operation needs (an API key never reaches billing, erasure, exports or the audit trail), an account key was used where an organization key is needed (`organization_key_required`), or an owner/admin has no second factor (`organization_mfa_required`).
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: Native product access must be enabled first.
        '503':
          description: Domain services unavailable.
      tags:
      - Organizations
    post:
      operationId: commsharbor_email_domain_products_add
      summary: Associate explicitly selected services with this domain
      description: 'The private email backend confirms domain ownership in this organization. Selected native products must already be enabled. Association is idempotent. It does not create a PageAudit project, HookPulse monitor or paid subscription.

        Returns: { services }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID. Must match X-Organization-Id.
        example: $ORG
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
        description: Domain ID in the caller's email organization.
        example: $DOMAIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: object
                  description: 'At most two unique values: pageaudit and hookpulse.'
              required:
              - services
      responses:
        '200':
          description: '{ services }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: string
                    description: Associated services with native organization access still enabled.
                required:
                - services
        '400':
          description: Invalid or duplicate service.
        '401':
          description: No signed-in session, or the API key is invalid or revoked (`invalid_api_key`); an old `ch_…` key answers `api_key_retired`.
        '403':
          description: The session or key lacks the permission this operation needs (an API key never reaches billing, erasure, exports or the audit trail), an account key was used where an organization key is needed (`organization_key_required`), or an owner/admin has no second factor (`organization_mfa_required`).
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: Native product access must be enabled first.
        '503':
          description: Domain services unavailable.
      tags:
      - Organizations
  /api/organizations/{organization_id}/email:
    get:
      operationId: commsharbor_email_workspace
      summary: Read the email workspace
      description: 'No guest access. Members can read. Owners, admins and organization keys can manage email. The private service credential stays on the server. Mailbox passwords and message content are never returned.

        Returns: { plan, subscription, capabilities, bootstrap, activation_required?, access_state, usage, domains, mailboxes, aliases, jobs }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID from the shared account. It must match X-Organization-Id.
        example: $ORG
      responses:
        '200':
          description: '{ plan, subscription, capabilities, bootstrap, activation_required?, access_state, usage, domains, mailboxes, aliases, jobs }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: string
                    description: Current free, paid or operator bootstrap plan.
                    nullable: true
                  subscription:
                    type: object
                    description: Observed service state and valid_until. Optional payment has state confirmed, plan, environment, valid_until and renewal_state from the current paid grant. A sandbox payment cannot activate a production service. Cancellation stops renewal and preserves the confirmed paid period. No payer or card data.
                  capabilities:
                    type: object
                    description: Observed smtp_send, storage_mode and storage_mb. Trial uses shared storage and denies sending. A paid upgrade can remain awaiting_activation while native mailbox policy is updated.
                  bootstrap:
                    type: boolean
                    description: Operator-managed adoption.
                  activation_required:
                    type: boolean
                    description: The confirmed payment environment cannot provision this control environment. Request operator activation. This field does not grant provisioning.
                  access_state:
                    type: string
                    description: Active or expired paid access. Expiry preserves stored mailbox data.
                  usage:
                    type: object
                    description: Reserved domain, mailbox, alias and storage counts.
                  domains:
                    type: array
                    items:
                      type: object
                    description: 'Domains with observed state, DNS provider, copyable setup instructions and verified webmail URLs. dns_progress has completed, total, percent, ready, checked_at and records. Each record has verified, status (pending: no answer of this type; mismatch: different published value; unavailable: lookup failed; verified: matched) and observed (up to 16 published values, 4096 characters each). No observation means not checked yet. dns_monitor has state and, when scheduled, next_check_at in UTC; checking is true while the job runs. A due time is not a propagation estimate. Percent counts confirmed records, not delivery readiness. DNS completion alone does not grant mailbox creation. Assistance has job_id, state and requested_at.'
                  mailboxes:
                    type: array
                    items:
                      type: object
                    description: Mailbox addresses, display names and quotas. No passwords.
                  aliases:
                    type: array
                    items:
                      type: object
                    description: Alias addresses and destinations.
                  jobs:
                    type: array
                    items:
                      type: object
                    description: At most 20 recent jobs. Monitoring is an active scheduled observation, not a completed setup. Each job also has its direct status_url.
                required:
                - plan
                - subscription
                - capabilities
                - bootstrap
                - access_state
                - usage
                - domains
                - mailboxes
                - aliases
                - jobs
        '400':
          description: Invalid fields or missing idempotency key.
        '401':
          description: No signed-in session, or the API key is invalid or revoked (`invalid_api_key`); an old `ch_…` key answers `api_key_retired`.
        '403':
          description: The session or key lacks the permission this operation needs (an API key never reaches billing, erasure, exports or the audit trail), an account key was used where an organization key is needed (`organization_key_required`), or an owner/admin has no second factor (`organization_mfa_required`).
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: Conflicting replay, pending setup or plan not active.
        '429':
          description: Daily provisioning capacity reached. Retry later with the same idempotency key.
        '503':
          description: Private email backend unavailable or Trial activation has not passed native proof.
      tags:
      - Organizations
  /api/organizations/{organization_id}/email/trial:
    post:
      operationId: commsharbor_email_trial_activate
      summary: 'Start the free receive-only Trial for 7 days, once per organization: 1 GB…'
      description: 'No guest access. Members can read. Owners, admins and organization keys can manage email. The private service credential stays on the server. Mailbox passwords and message content are never returned.

        Returns: { job }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID from the shared account. It must match X-Organization-Id.
        example: $ORG
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
        description: Stable key of 8 to 128 characters. Reuse it only with the same operation and body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: '{ job }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    type: object
                    description: Durable job ID, status and status_url. A 202 response is acceptance, not completion.
                required:
                - job
        '400':
          description: Invalid fields or missing idempotency key.
        '401':
          description: No signed-in session, or the API key is invalid or revoked (`invalid_api_key`); an old `ch_…` key answers `api_key_retired`.
        '403':
          description: The session or key lacks the permission this operation needs (an API key never reaches billing, erasure, exports or the audit trail), an account key was used where an organization key is needed (`organization_key_required`), or an owner/admin has no second factor (`organization_mfa_required`).
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: Conflicting replay, pending setup or plan not active.
        '429':
          description: Daily provisioning capacity reached. Retry later with the same idempotency key.
        '503':
          description: Private email backend unavailable or Trial activation has not passed native proof.
      tags:
      - Organizations
  /api/organizations/{organization_id}/email/domain-setup:
    get:
      operationId: commsharbor_email_domain_setup
      summary: Find an existing domain. Use it before a purchase.
      description: 'No guest access. Members can read. Owners, admins and organization keys can manage email. The private service credential stays on the server. Mailbox passwords and message content are never returned.

        Returns: { existing }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID from the shared account. It must match X-Organization-Id.
        example: $ORG
      - name: domain
        in: query
        required: true
        schema:
          type: string
        description: Domain to check, at most 253 characters.
      responses:
        '200':
          description: '{ existing }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  existing:
                    type: object
                    description: 'Authorized existing domain: organization_id, domain_id and organization name. Null also covers a foreign or unavailable organization; no foreign ownership information is returned.'
                    nullable: true
                required:
                - existing
        '400':
          description: Invalid fields or missing idempotency key.
        '401':
          description: No signed-in session, or the API key is invalid or revoked (`invalid_api_key`); an old `ch_…` key answers `api_key_retired`.
        '403':
          description: The session or key lacks the permission this operation needs (an API key never reaches billing, erasure, exports or the audit trail), an account key was used where an organization key is needed (`organization_key_required`), or an owner/admin has no second factor (`organization_mfa_required`).
        '404':
          description: The organization is not available to this session or key (no membership, CommsHarbor is not enabled for it, or the key belongs to another organization), or the resource does not exist in it. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: Conflicting replay, pending setup or plan not active.
        '429':
          description: Daily provisioning capacity reached. Retry later with the same idempotency key.
        '503':
          description: Private email backend unavailable or Trial activation has not passed native proof.
      tags:
      - Organizations
  /api/organizations/{organization_id}/email/domains:
    post:
      operationId: commsharbor_email_domain_create
      summary: Register a domain and its ownership challenge
      description: 'No guest access. Members can read. Owners, admins and organization keys can manage email. The private service credential stays on the server. Mailbox passwords and message content are never returned.

        Returns: { job }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Organization ID from the shared account. It must match X-Organization-Id.
        example: $ORG
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
        description: Stable key of 8 to 128 characters. Reuse it only with the same operation and body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  description: Exact domain name.
              required:
              - domain
      responses:
        '200':
          description: '{ job }'
