              type: object
              properties:
                csv:
                  type: string
                  description: The CSV itself, up to 5 MB and 10,000 rows.
                mapping:
                  type: object
                  description: 'Which CSV column feeds which contact field, e.g. `{ "email": "Email" }`.'
                basis:
                  type: string
                  description: Why sending is allowed.
                source:
                  type: string
