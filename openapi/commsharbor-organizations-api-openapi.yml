components:
  schemas:
    PageCamelAuditEvent:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
          description: The records on this page.
        nextCursor:
          type: string
          description: Cursor for the next page; null when there are no more.
          nullable: true
      required:
      - items
      - nextCursor
      description: The same listing with the cursor in camelCase. Older resources ship it this way and the name is kept because changing it would break clients already reading it.
    Organization:
      type: object
      properties:
        id:
          type: string
          description: Organization ID in the shared account, used in every tenant route.
        name:
          type: string
          description: Display name, from the shared account; null with an organization API key.
          nullable: true
        role:
          type: string
          description: Your role in it, from the shared account; null with an organization API key.
          nullable: true
          enum:
          - owner
          - admin
          - member
          - null
        email_workspace:
          type: string
          description: Tenant-scoped email workspace URL. Read it for the current plan, allowances and resources.
      required:
      - id
      - name
      - role
      - email_workspace
      description: A tenant, opened by id. It lives in the shared account (name, members, roles); CommsHarbor adds the plan. Every piece of customer data in this product is scoped to exactly one.
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          description: Event ID.
        action:
          type: string
          description: What happened, e.g. `domain.created`.
        actor_user_id:
          type: string
          description: Who did it; null when the actor was a key or the system.
          nullable: true
        target:
          type: string
          description: What it happened to.
          nullable: true
        metadata:
          type: object
          description: Extra context for this action. Never contains recipient PII.
        created_at:
          type: string
          description: When it happened (UTC).
      required:
      - id
      - action
      - actor_user_id
      - target
      - metadata
      - created_at
      description: One append-only record of something that happened in the organization. Audit is never rewritten.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use an organisation API key (`mmk_…`) for permitted work in that organisation. Account operations require the shared account session. Paid routes accept a global credit token (`cred_…`). Monthly purchases require a recent human session.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
