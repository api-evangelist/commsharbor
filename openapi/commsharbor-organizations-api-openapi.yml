          type: string
          description: The text of the activity.
        deal_id:
          type: string
          description: Deal it refers to.
          nullable: true
        contact_id:
          type: string
          description: Contact it refers to.
          nullable: true
        company_id:
          type: string
          description: Company it refers to.
