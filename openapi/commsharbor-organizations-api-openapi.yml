  /api/organizations/{organization_id}/campaigns/{campaign_id}/launch:
    post:
      operationId: commsharbor_campaign_launch
      summary: Freeze the eligible recipients and launch — or schedule — the campaign, exactly…
      description: 'The freeze happens once and never again: consent, suppressions and audience membership are evaluated at this moment, and the resulting set is what gets sent. Replaying the same Idempotency-Key returns the same campaign and produces no second dispatch.

        Returns: { campaign{id,name,status,domain_id,audience_id,template_id,template_version,scheduled_for,frozen_recipients,created_at}, dispatch_job_id, replayed }'
      security:
      - bearerAuth: []
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
        description: Stable key for this launch. A replay returns the same campaign and never freezes a second recipient set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_for:
                  type: string
                  description: When to send, ISO-8601 with offset, interpreted in the organization's timezone. Omit to send now.
            example:
              scheduled_for: '2026-08-30T14:00:00-03:00'
      responses:
        '200':
          description: '{ campaign{id,name,status,domain_id,audience_id,template_id,template_version,scheduled_for,frozen_recipients,created_at}, dispatch_job_id, replayed }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    allOf:
                    - $ref: '#/components/schemas/Campaign'
                    description: The campaign, now scheduled or sending, with the frozen recipient count.
                  dispatch_job_id:
                    type: string
                    description: The dispatch job that will walk the frozen set.
                    nullable: true
                  replayed:
                    type: boolean
                    description: True when this was a replay and nothing new was frozen or queued.
                required:
                - campaign
                - dispatch_job_id
                - replayed
        '400':
          description: Missing Idempotency-Key or an unparseable schedule.
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
        '409':
          description: Already launched, marketing paused for the organization, or no eligible recipients.
        '429':
          description: Not enough capacity for the frozen recipient set.
      tags:
      - Organizations
