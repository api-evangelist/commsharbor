                    description: The import in `preview` state.
                  preview:
                    type: array
                    items:
                      type: object
                    description: The first parsed rows, so you can check the mapping before confirming.
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportError'
                    description: Rows that would be rejected, addressed by line number.
                required:
                - import
