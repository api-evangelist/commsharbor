openapi: 3.2.0
info:
  title: CommsHarbor Health API
  version: 1d751aaf
  description: Manage domain email, mailboxes, aliases and durable jobs. Each call uses its organization's identity.
servers:
- url: https://commsharbor.com
tags:
- name: Health
paths:
  /api/health:
    get:
      operationId: commsharbor_health
      summary: Read liveness, environment and the commit currently deployed
      description: 'Smoke tests wait for their own commit to appear here instead of racing edge propagation.

        Returns: { ok, app, build, environment, timestamp }'
      security: []
      responses:
        '200':
          description: '{ ok, app, build, environment, timestamp }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
      - Health
components:
  schemas:
    Health:
      type: object
      properties:
        ok:
          type: boolean
          description: Always true when the Worker answers.
        app:
          type: string
          description: Product name.
        build:
          type: string
          description: Deployed commit; CI passes the short SHA at deploy time.
        environment:
          type: string
          description: Which environment answered.
        timestamp:
          type: string
          description: Response time (UTC, ISO-8601).
      required:
      - ok
      - app
      - build
      - environment
      - timestamp
      description: Liveness and the commit currently serving. Smoke tests wait for their own deploy here instead of racing edge propagation.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use an organisation API key (`mmk_…`) for permitted work in that organisation. Account operations require the shared account session. Paid routes accept a global credit token (`cred_…`). Monthly purchases require a recent human session.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - email
  - mailbox-management
  docs:
    homepage: https://commsharbor.com/
    apiReference: https://commsharbor.com/developers
    llms: https://commsharbor.com/llms.txt
