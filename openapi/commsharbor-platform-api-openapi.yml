components:
  schemas:
    PageLead:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lead'
          description: The records on this page.
        next_cursor:
          type: string
          description: Cursor for the next page; null when there are no more.
          nullable: true
      required:
      - items
      - next_cursor
      description: Cursor-paginated listing. A null cursor means this was the last page.
    Lead:
      type: object
      properties:
        id:
          type: string
          description: Lead ID.
        email:
          type: string
          description: Contact email for the lead.
        name:
          type: string
          description: Who to talk to.
        company_name:
          type: string
          description: Name of the prospective organization.
          nullable: true
        source:
          type: string
          description: Where the lead came from, e.g. `manual`.
          nullable: true
        stage:
          type: string
          description: Where the lead is in our own funnel, e.g. `new`.
        organization_id:
          type: string
          description: The organization this lead became, once it converted.
          nullable: true
        created_at:
          type: string
          description: Creation time (UTC).
        updated_at:
          type: string
          description: Last change (UTC).
          nullable: true
        url:
          type: string
          description: Absolute URL of this lead.
      required:
      - id
      - email
      - name
      - company_name
      - source
      - stage
      - organization_id
      - created_at
      - updated_at
      - url
      description: A prospective ORGANIZATION in the platform CRM. This is our own pipeline about tenants — it is not tenant data, and it is only reachable with an explicit platform grant.
    PagePlatformActivity:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformActivity'
          description: The records on this page.
        next_cursor:
          type: string
          description: Cursor for the next page; null when there are no more.
          nullable: true
      required:
      - items
      - next_cursor
      description: Cursor-paginated listing. A null cursor means this was the last page.
    PlatformTask:
      type: object
      properties:
        id:
          type: string
          description: Task ID.
        title:
          type: string
          description: What has to be done.
        status:
          type: string
          description: Current state.
        lead_id:
          type: string
          description: Lead the task belongs to.
          nullable: true
        due_at:
          type: string
          description: When it is due (UTC).
          nullable: true
        assignee_user_id:
          type: string
          description: Who is responsible.
          nullable: true
        created_at:
          type: string
          description: Creation time (UTC).
        updated_at:
          type: string
          description: Last change (UTC).
          nullable: true
        url:
          type: string
          description: Absolute URL of this task.
      required:
      - id
      - title
      - status
      - lead_id
      - due_at
      - assignee_user_id
      - created_at
      - updated_at
      - url
      description: 'Work on a platform lead. Same idea as a CRM task, different subject: this one is about a prospective tenant, not about a tenant''s customer.'
    PagePlatformTask:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTask'
          description: The records on this page.
        next_cursor:
          type: string
          description: Cursor for the next page; null when there are no more.
          nullable: true
      required:
      - items
      - next_cursor
      description: Cursor-paginated listing. A null cursor means this was the last page.
    PlatformActivity:
      type: object
      properties:
        id:
          type: string
          description: Activity ID.
        activity_type:
          type: string
