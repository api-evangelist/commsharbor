openapi: 3.2.0
info:
  title: CommsHarbor Platform API
  version: 2d690e87
  description: CommsHarbor API. Organization identity is explicit and tenant-scoped.
servers:
- url: https://commsharbor.com
tags:
- name: Platform
paths:
  /api/platform/context:
    get:
      operationId: commsharbor_platform_context
      summary: Confirm an explicitly granted platform administrator
      description: 'Tenant ownership grants nothing here: platform access is a separate, explicit grant.

        Returns: { role, user_id }'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: '{ role, user_id }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                    description: The platform role that was granted.
                  user_id:
                    type: string
                    description: Who holds it.
                required:
                - role
                - user_id
        '401':
          description: No session.
        '403':
          description: This person has no platform grant.
      tags:
      - Platform
  /api/platform/crm/leads:
    get:
      operationId: commsharbor_platform_crm_leads_list
      summary: List leads in the platform CRM — a prospective ORGANIZATION in our own funnel…
      description: 'Returns: { items[{id,email,name,company_name,source,stage,organization_id,created_at,updated_at,url}], next_cursor }'
      security:
      - bearerAuth: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from the previous page. Do not build or parse it.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: Page size, from 1 to 100.
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Free-text search over the record's main fields.
      - name: stage
        in: query
        required: false
        schema:
          type: string
        description: Restrict to one funnel stage of the platform lead.
      responses:
        '200':
          description: '{ items[{id,email,name,company_name,source,stage,organization_id,created_at,updated_at,url}], next_cursor }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageLead'
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Platform
    post:
      operationId: commsharbor_platform_crm_leads_create
      summary: Create a lead in the platform CRM
      description: 'Returns: { id, email, name, company_name, source, stage, organization_id, created_at, updated_at, url }'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Contact email for the lead.
                name:
                  type: string
                  description: Who to talk to.
                company_name:
                  type: string
                  description: Name of the prospective organization.
                source:
                  type: string
                  description: Where the lead came from, e.g. `manual`.
                stage:
                  type: string
                  description: Where it sits in our funnel, e.g. `new`.
                organization_id:
                  type: string
                  description: The organization it became, once converted.
              required:
              - email
              - name
            example:
              email: lead@example.com
              name: Lead
              company_name: Acme
              source: manual
              stage: new
              organization_id: org_…
      responses:
        '200':
          description: '{ id, email, name, company_name, source, stage, organization_id, created_at, updated_at, url }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '400':
          description: A required field is missing, or a referenced record does not exist here.
        '401':
          description: No session, no API key, or the credential does not resolve to this organization.
        '403':
          description: The identity is valid but lacks the required role or scope for this operation.
        '404':
          description: The resource does not exist in this organization. Another tenant's ID answers the same 404 — the API never confirms that it exists elsewhere.
      tags:
      - Platform
