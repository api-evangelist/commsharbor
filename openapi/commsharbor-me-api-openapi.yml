openapi: 3.2.0
info:
  title: CommsHarbor Me API
  version: 1d751aaf
  description: Manage domain email, mailboxes, aliases and durable jobs. Each call uses its organization's identity.
servers:
- url: https://commsharbor.com
tags:
- name: Me
paths:
  /api/me:
    get:
      operationId: commsharbor_me
      summary: Read the global profile and the platform role, if any
      description: '`user.id` is the shared-account ID. Organizations are not listed here: they live in the shared account, which does not list them inside products yet — open a workspace by its ID with `GET /api/organizations/{organization_id}`.

        Returns: { user{id,email}, profile{name,locale,timeZone,theme,revision}, platform_role }'
      security:
      - globalAccount: []
      responses:
        '200':
          description: '{ user{id,email}, profile{name,locale,timeZone,theme,revision}, platform_role }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    allOf:
                    - $ref: '#/components/schemas/User'
                    description: The person behind the session.
                  profile:
                    allOf:
                    - $ref: '#/components/schemas/Profile'
                    description: Global MM profile — it belongs to the person, edited on the account, not to a tenant.
                  platform_role:
                    type: string
                    description: Platform role, when one was explicitly granted. Owning a tenant grants nothing here.
                    nullable: true
                required:
                - user
                - profile
                - platform_role
        '401':
          description: No session, or the session expired.
        '503':
          description: auth_unavailable
      tags:
      - Me
components:
  schemas:
    Profile:
      type: object
      properties:
        name:
          type: string
          description: Name shown in the interface (empty until the person sets one).
        locale:
          type: string
          description: Preferred language, e.g. `pt-BR` or `en`.
        timeZone:
          type: string
          description: IANA time zone, e.g. `America/Sao_Paulo`.
        theme:
          type: string
          description: '`light`, `dark` or `system`.'
        revision:
          type: integer
          description: Optimistic revision of the profile.
      required:
      - name
      - locale
      - timeZone
      - theme
      - revision
      description: Global MM profile. It belongs to the person, edited on the account, not to any organization.
    User:
      type: object
      properties:
        id:
          type: string
          description: User ID.
        email:
          type: string
          description: Email address verified by the global account.
      required:
      - id
      - email
      description: The person behind the session.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use an organisation API key (`mmk_…`) for permitted work in that organisation. Account operations require the shared account session. Paid routes accept a global credit token (`cred_…`). Monthly purchases require a recent human session.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - email
  - mailbox-management
  docs:
    homepage: https://commsharbor.com/
    apiReference: https://commsharbor.com/developers
    llms: https://commsharbor.com/llms.txt
