openapi: 3.2.0
info:
  title: CommsHarbor MCP API
  version: 1d751aaf
  description: Manage domain email, mailboxes, aliases and durable jobs. Each call uses its organization's identity.
servers:
- url: https://commsharbor.com
tags:
- name: MCP
paths:
  /mcp:
    get:
      operationId: get_mcp
      summary: 'Inspect the remote MCP server card: transport, protocol and tool count'
      description: '`POST /mcp` speaks Streamable HTTP with JSON-RPC 2.0. The tools are the operations in this catalog; the MCP has no backend of its own.

        Returns: { transport, protocol_version, endpoint, server, tools, usage, api_index }'
      security: []
      responses:
        '200':
          description: '{ transport, protocol_version, endpoint, server, tools, usage, api_index }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  transport:
                    type: string
                    description: How the server speaks — `streamable-http`.
                  protocol_version:
                    type: string
                    description: MCP protocol version the server implements.
                  endpoint:
                    type: string
                    description: Absolute URL to POST JSON-RPC to.
                  server:
                    type: object
                    description: '`name` and `version` of this server; the version is the deployed commit.'
                  tools:
                    type: integer
                    description: How many tools the server exposes.
                  usage:
                    type: string
                    description: One line saying how to call it.
                  api_index:
                    type: string
                    description: The self-describing API index, for the operations behind the tools.
                required:
                - transport
                - protocol_version
                - endpoint
                - server
                - tools
                - usage
                - api_index
      tags:
      - MCP
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use an organisation API key (`mmk_…`) for permitted work in that organisation. Account operations require the shared account session. Paid routes accept a global credit token (`cred_…`). Monthly purchases require a recent human session.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
