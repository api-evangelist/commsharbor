openapi: 3.2.0
info:
  title: CommsHarbor Credito API
  version: 1d751aaf
  description: Manage domain email, mailboxes, aliases and durable jobs. Each call uses its organization's identity.
servers:
- url: https://commsharbor.com
tags:
- name: Credito
paths:
  /api/credito/assinaturas:
    get:
      operationId: get_api_credito_assinaturas
      summary: List at most 20 subscriptions owned by this account in this product
      description: 'Requires enabled monthly sales or a server-authorized payment test. Otherwise returns 404. Filters account, product, merchant and environment. Does not query Asaas or count the table. The accepted offer remains readable after sales close. Sandbox reads require a valid ticket. The complete query is limited to 640 characters, including the cursor.

        Returns: { itens[{recurso,id,oferta_id,oferta,estado,simulado,pagamento_em,criado_em,atualizado_em,cancelamento_em,cancelado_em}], proximo, simulado }'
      security:
      - bearerAuth: []
      parameters:
      - name: dev
        in: query
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. At most 512 characters. It never authorizes another account.
      - name: x402_dev
        in: query
        required: false
        schema:
          type: string
        description: Alias for dev. Send only one of these parameters.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: 'proximo from the previous page: UTC ISO time with milliseconds, ~ and a 32-character hexadecimal ID.'
      - name: recurso
        in: query
        required: false
        schema:
          type: string
        description: 'Product resource: at most 256 characters without controls. Filters this account''s subscriptions.'
      - name: X-X402-Dev
        in: header
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. The request body's sandbox flag does not authorize a test.
      responses:
        '200':
          description: '{ itens[{recurso,id,oferta_id,oferta,estado,simulado,pagamento_em,criado_em,atualizado_em,cancelamento_em,cancelado_em}], proximo, simulado }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistroDeAssinatura'
                    description: At most 20 records owned by this account.
                  proximo:
                    type: string
                    description: Next-page cursor, or null.
                    nullable: true
                  simulado:
                    type: boolean
                    description: Server-authorized environment for this request.
                required:
                - itens
                - proximo
                - simulado
        '400':
          description: Invalid body, query, offer, acceptance, card or environment; card declined.
        '401':
          description: Missing or invalid session. An API key cannot authorize these requests.
        '403':
          description: Invalid origin or cookie; invalid CSRF protection on a write.
        '404':
          description: Sales and payment tests are unavailable, or the subscription is outside this account, product, merchant or environment.
        '431':
          description: Cookie header exceeds 8 KiB.
        '503':
          description: Account, database, configuration or provider unavailable; four concurrent operations already in progress.
      tags:
      - Credito
    post:
      operationId: post_api_credito_assinaturas
      summary: Subscribe and pay for the monthly offer by card through the API
      description: 'Requires enabled monthly sales or a server-authorized payment test. Otherwise returns 404. Requires a human session authenticated within the last five minutes. Rejects Authorization and X-Api-Key. Send only the declared fields, with HTTPS and a JSON body of at most 4 KiB. recurso is accepted only when the product verifies it. simulado must match the catalog and authorized environment. An expired test ticket cannot change the request to production. Price and benefits come from the server. Card data goes to Asaas for this request only; it is not stored or returned. The server supplies the buyer IP. Allow up to 120 seconds. A repeated offer returns the existing reservation. An uncertain outcome requires a reference lookup before another creation. Creation grants no benefit. Only an Asaas-confirmed payment grants the paid period.

        Returns: { recurso, id, oferta_id, oferta{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}, estado, simulado, pagamento_em, criado_em, atualizado_em, cancelamento_em, cancelado_em }'
      security:
      - bearerAuth: []
      parameters:
      - name: dev
        in: query
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. At most 512 characters. It never authorizes another account.
      - name: x402_dev
        in: query
        required: false
        schema:
          type: string
        description: Alias for dev. Send only one of these parameters.
      - name: X-X402-Dev
        in: header
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. The request body's sandbox flag does not authorize a test.
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Exact HTTPS origin of this product.
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: 64-character token from this product's session bootstrap. Required for writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recurso:
                  type: string
                  description: Required when the product sells per resource. The server verifies the resource and account.
                simulado:
                  type: boolean
                  description: Value from the catalog. States intent; grants no payment-test authority.
                aceite:
                  allOf:
                  - $ref: '#/components/schemas/AceiteDeAssinatura'
                  description: Only oferta_id, versao, hash and renovacao. Match the current catalog.
                cartao:
                  allOf:
                  - $ref: '#/components/schemas/CartaoDeAssinatura'
                  description: Cardholder's card and billing data. Do not send price, IP, environment or another account's identifier.
              required:
              - simulado
              - aceite
              - cartao
      responses:
        '200':
          description: '{ recurso, id, oferta_id, oferta{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}, estado, simulado, pagamento_em, criado_em, atualizado_em, cancelamento_em, cancelado_em }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroDeAssinatura'
        '400':
          description: Invalid body, query, offer, acceptance, card or environment; card declined.
        '401':
          description: Missing or invalid session. An API key cannot authorize these requests.
        '403':
          description: Invalid origin or cookie; invalid CSRF protection on a write.
        '404':
          description: Sales and payment tests are unavailable, or the subscription is outside this account, product, merchant or environment.
        '409':
          description: Incompatible state or another offer already reserved for this account and product.
        '413':
          description: JSON body exceeds 4 KiB.
        '415':
          description: Body is not application/json or has content encoding.
        '429':
          description: This account reached its daily charge-creation limit.
        '431':
          description: Cookie header exceeds 8 KiB.
        '503':
          description: Account, database, configuration or provider unavailable; four concurrent operations already in progress.
      tags:
      - Credito
  /api/credito/assinaturas/ofertas:
    get:
      operationId: get_api_credito_assinaturas_ofertas
      summary: Read the monthly offers and request environment when subscriptions are enabled
      description: 'Requires enabled monthly sales or a server-authorized payment test. Otherwise returns 404. Creates no charge, reservation or benefit. Does not convert a trial into a purchase.

        Returns: { ofertas[{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}], simulado }'
      security: []
      parameters:
      - name: dev
        in: query
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. At most 512 characters. It never authorizes another account.
      - name: x402_dev
        in: query
        required: false
        schema:
          type: string
        description: Alias for dev. Send only one of these parameters.
      - name: X-X402-Dev
        in: header
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. The request body's sandbox flag does not authorize a test.
      responses:
        '200':
          description: '{ ofertas[{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}], simulado }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ofertas:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfertaDeAssinatura'
                    description: 1 to 8 versioned offers for this product.
                  simulado:
                    type: boolean
                    description: Server-authorized environment for this request.
                required:
                - ofertas
                - simulado
        '400':
          description: Invalid body, query, offer, acceptance, card or environment; card declined.
        '404':
          description: Sales and payment tests are unavailable, or the subscription is outside this account, product, merchant or environment.
        '503':
          description: Account, database, configuration or provider unavailable; four concurrent operations already in progress.
      tags:
      - Credito
  /api/credito/assinaturas/{id}:
    get:
      operationId: get_api_credito_assinaturas_by_id
      summary: Read an owned subscription and its accepted offer without creating a payment
      description: 'Requires enabled monthly sales or a server-authorized payment test. Otherwise returns 404. Requires this product''s valid human session. Does not query the provider. Sandbox reads also require a valid ticket.

        Returns: { recurso, id, oferta_id, oferta{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}, estado, simulado, pagamento_em, criado_em, atualizado_em, cancelamento_em, cancelado_em }'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 'Local subscription ID: 32 lowercase hexadecimal characters.'
        example: 0123456789abcdef0123456789abcdef
      - name: dev
        in: query
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. At most 512 characters. It never authorizes another account.
      - name: x402_dev
        in: query
        required: false
        schema:
          type: string
        description: Alias for dev. Send only one of these parameters.
      - name: recurso
        in: query
        required: false
        schema:
          type: string
        description: 'Product resource: at most 256 characters without controls. Filters this account''s subscriptions.'
      - name: X-X402-Dev
        in: header
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. The request body's sandbox flag does not authorize a test.
      responses:
        '200':
          description: '{ recurso, id, oferta_id, oferta{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}, estado, simulado, pagamento_em, criado_em, atualizado_em, cancelamento_em, cancelado_em }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroDeAssinatura'
        '400':
          description: Invalid body, query, offer, acceptance, card or environment; card declined.
        '401':
          description: Missing or invalid session. An API key cannot authorize these requests.
        '403':
          description: Invalid origin or cookie; invalid CSRF protection on a write.
        '404':
          description: Sales and payment tests are unavailable, or the subscription is outside this account, product, merchant or environment.
        '431':
          description: Cookie header exceeds 8 KiB.
        '503':
          description: Account, database, configuration or provider unavailable; four concurrent operations already in progress.
      tags:
      - Credito
    post:
      operationId: post_api_credito_assinaturas_by_id
      summary: Stop future charges for an owned subscription and keep the paid period
      description: 'Requires enabled monthly sales or a server-authorized payment test. Otherwise returns 404. Send only {} as JSON, with a valid session, origin and CSRF token. The server records cancellation intent before it calls Asaas. Pending is not confirmed cancellation. The request is repeatable. Refunds have a separate process; cancellation does not refund a payment.

        Returns: { recurso, id, oferta_id, oferta{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}, estado, simulado, pagamento_em, criado_em, atualizado_em, cancelamento_em, cancelado_em }'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 'Local subscription ID: 32 lowercase hexadecimal characters.'
        example: 0123456789abcdef0123456789abcdef
      - name: dev
        in: query
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. At most 512 characters. It never authorizes another account.
      - name: x402_dev
        in: query
        required: false
        schema:
          type: string
        description: Alias for dev. Send only one of these parameters.
      - name: recurso
        in: query
        required: false
        schema:
          type: string
        description: 'Product resource: at most 256 characters without controls. Filters this account''s subscriptions.'
      - name: X-X402-Dev
        in: header
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. The request body's sandbox flag does not authorize a test.
      - name: Origin
        in: header
        required: true
        schema:
          type: string
        description: Exact HTTPS origin of this product.
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
        description: 64-character token from this product's session bootstrap. Required for writes.
      requestBody:
        required: true
        content:
          application/json:
            example: {}
      responses:
        '200':
          description: '{ recurso, id, oferta_id, oferta{id,produto,versao,preco_centavos,moeda,ciclo,renovacao_automatica,compromisso_meses,cancelamento,acesso_pago,teste_dias,conversao_teste,beneficios,hash}, estado, simulado, pagamento_em, criado_em, atualizado_em, cancelamento_em, cancelado_em }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroDeAssinatura'
        '400':
          description: Invalid body, query, offer, acceptance, card or environment; card declined.
        '401':
          description: Missing or invalid session. An API key cannot authorize these requests.
        '403':
          description: Invalid origin or cookie; invalid CSRF protection on a write.
        '404':
          description: Sales and payment tests are unavailable, or the subscription is outside this account, product, merchant or environment.
        '409':
          description: Incompatible state or another offer already reserved for this account and product.
        '413':
          description: JSON body exceeds 4 KiB.
        '415':
          description: Body is not application/json or has content encoding.
        '431':
          description: Cookie header exceeds 8 KiB.
        '503':
          description: Account, database, configuration or provider unavailable; four concurrent operations already in progress.
      tags:
      - Credito
  /api/credito/assinaturas/{id}/estado:
    get:
      operationId: get_api_credito_assinaturas_by_id_estado
      summary: Observe changes to an owned subscription through the realtime channel
      description: 'Requires enabled monthly sales or a server-authorized payment test. Otherwise returns 404. Requires this product''s human session. Returns only ID and cursor, including after reconnection. A signal grants no paid access and exposes no financial data. Read the authenticated subscription after a change. That read still verifies environment, merchant and resource.

        Returns: { id, cursor }'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 'Local subscription ID: 32 lowercase hexadecimal characters.'
        example: 0123456789abcdef0123456789abcdef
      - name: dev
        in: query
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. At most 512 characters. It never authorizes another account.
      - name: x402_dev
        in: query
        required: false
        schema:
          type: string
        description: Alias for dev. Send only one of these parameters.
      - name: X-X402-Dev
        in: header
        required: false
        schema:
          type: string
        description: Valid signed payment-test ticket. The request body's sandbox flag does not authorize a test.
      responses:
        '200':
          description: '{ id, cursor }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: 'Local subscription ID: 32 lowercase hexadecimal characters.'
                  cursor:
                    type: string
                    description: State version. Compare for equality. It does not confirm a payment.
                required:
                - id
                - cursor
        '400':
          description: Invalid body, query, offer, acceptance, card or environment; card declined.
        '401':
          description: Missing or invalid session. An API key cannot authorize these requests.
        '403':
          description: Invalid origin or cookie; invalid CSRF protection on a write.
        '404':
          description: Sales and payment tests are unavailable, or the subscription is outside this account, product, merchant or environment.
        '431':
          description: Cookie header exceeds 8 KiB.
        '503':
          description: Account, database, configuration or provider unavailable; four concurrent operations already in progress.
      tags:
      - Credito
  /api/credito:
    post:
      operationId: post_api_credito
      summary: 'Top up prepaid credit: pay once with x402 and get the token that debits on any…'
      description: 'Returns: { token, saldo_usd, guarde, usar, saldo_em }'
      security: []
      parameters:
      - name: usd
        in: query
        required: true
        schema:
          type: number
        description: 'Package: 0.1, 1, 5, 10 or 25 dollars.'
      responses:
        '200':
          description: '{ token, saldo_usd, guarde, usar, saldo_em }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Bearer token for the balance (`cred_…`). Shown ONCE — it cannot be recovered.
                  saldo_usd:
                    type: string
                    description: Credited balance.
                  guarde:
                    type: string
                    description: Warning that the token is the bearer of the credit.
                  usar:
                    type: string
                    description: How to present the token on paid routes.
                  saldo_em:
                    type: string
                    description: Where to check balance and statement.
                required:
                - token
                - saldo_usd
                - guarde
                - usar
                - saldo_em
        '400':
          description: Package outside the list (0.1, 1, 5, 10 or 25).
        '402':
          description: Unpaid — the body carries the x402 `accepts[]`.
      tags:
      - Credito
    get:
      operationId: get_api_credito
      summary: Credit balance and statement — the latest movements, without returning the token
      description: 'Returns: { saldo_micros, saldo_usd, criado_em, movimentos }'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: '{ saldo_micros, saldo_usd, criado_em, movimentos }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  saldo_micros:
                    type: integer
                    description: Balance in micro-dollars (1e-6 USD).
                  saldo_usd:
                    type: string
                    description: Formatted balance.
                  criado_em:
                    type: string
                    description: When the credit was opened.
                  movimentos:
                    type: array
                    items:
                      type: object
                    description: Recent credits and debits, with product and resource.
                required:
                - saldo_micros
                - saldo_usd
                - criado_em
                - movimentos
        '401':
          description: No token, or unknown token.
      tags:
      - Credito
  /api/credito/pix:
    get:
      operationId: get_api_credito_pix
      summary: 'Credit by Pix (Brazil): the key, the fixed rate, the packs in reais and what…'
      description: 'Returns: { chave, brl_por_usd, pacotes, comprovante, liberacao }'
      security: []
      responses:
        '200':
          description: '{ chave, brl_por_usd, pacotes, comprovante, liberacao }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  chave:
                    type: string
                    description: The Pix key that receives the payment.
                  brl_por_usd:
                    type: number
                    description: Fixed rate used for the packs.
                  pacotes:
                    type: array
                    items:
                      type: object
                    description: 'The packs (3, 5, 10 or 25 dollars), each with `brl_centavos` and `copia_e_cola` (the Pix copy-and-paste code for the amount, the same text as the QR: the bank app comes with the amount filled in).'
                  comprovante:
                    type: object
                    description: Accepted types (photo or PDF) and the maximum size, in bytes.
                  liberacao:
                    type: string
                    description: '`manual`: the owner checks the Pix and releases it.'
                required:
                - chave
                - brl_por_usd
                - pacotes
                - comprovante
                - liberacao
      tags:
      - Credito
    post:
      operationId: post_api_credito_pix
      summary: 'Request credit paid by Pix: multipart with `usd`, `comprovante` (photo or PDF…'
      description: 'The credit code comes back in the response and works once the owner checks the Pix and releases it (by hand, usually the same day). `email` is required: it is how the owner reaches the person. Optional: `nome`, `pagina` (the page the request came from, up to 2,000 characters) and what the person was buying when the 402 came — `recurso` (up to 2,000), `descricao` (up to 300) and `preco_usd` (decimal, e.g. `0.50`); and `navegador_id` (a UUID that links the requests from the same browser). Everything that arrives is recorded with the request — the receipt included —, with the signed-in account (checked by the session cookie), the network and browser.

        Returns: { id, estado, credito, estado_em }'
      security: []
      responses:
        '200':
          description: '{ id, estado, credito, estado_em }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Request id, to follow it.
                  estado:
                    type: string
                    description: '`pendente` until the decision.'
                  credito:
                    type: string
                    description: The `cred_…` token, shown ONCE; it works after the release.
                  estado_em:
                    type: string
                    description: Where to follow the request.
                required:
                - id
                - estado
                - credito
                - estado_em
        '400':
          description: Pack outside the list (3, 5, 10 or 25), no receipt or no valid e-mail.
        '413':
          description: Receipt above 2 MB.
        '415':
          description: Receipt that is neither a photo (JPEG, PNG, WebP) nor a PDF.
        '429':
          description: This network already sent today's requests.
        '502':
          description: 'The e-mail to the owner did not go out: the request is recorded as `falhou`; send it again.'
        '503':
          description: Review queue full, or Pix not available in this app.
      tags:
      - Credito
  /api/credito/pix/{id}:
    get:
      operationId: get_api_credito_pix_by_id
      summary: 'Status of a Pix credit request: `pendente`, `liberado`, `recusado` or `falhou`'
      description: 'Returns: { estado, usd, decidido_em }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Request id (32 hex).
        example: 0123456789abcdef0123456789abcdef
      responses:
        '200':
          description: '{ estado, usd, decidido_em }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    description: '`pendente`, `liberado`, `recusado` or `falhou` (the e-mail to the owner did not go out; send again).'
                  usd:
                    type: integer
                    description: The requested pack.
                  decidido_em:
                    type: string
                    description: When the owner decided, or `null`.
                required:
                - estado
                - usd
                - decidido_em
        '404':
          description: Unknown request.
      tags:
      - Credito
  /api/credito/asaas/{id}/cancelar:
    post:
      operationId: post_api_credito_asaas_by_id_cancelar
      summary: Cancels a pending charge when the payment dialog closes
      description: 'Requires the `cancelamento` capability returned at creation. An older credit charge accepts its token in `credito`. The product and environment must match. This does not refund payments or remove records. 202 means cancellation is pending; the scheduled worker retries provider failures.

        Returns: { id, estado }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Charge id (32 hex).
        example: 0123456789abcdef0123456789abcdef
      responses:
        '200':
          description: '{ id, estado }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Charge id.
                  estado:
                    type: string
                    description: '`cancelando`, `vencido`, or the confirmed final state.'
                required:
                - id
                - estado
        '404':
          description: Invalid charge or capability, or a different product or environment.
      tags:
      - Credito
  /api/credito/asaas:
    get:
      operationId: get_api_credito_asaas
      summary: 'Automatic Pix: whether it is available in this app, the packs in reais and the…'
      description: 'Returns: { disponivel, pacotes, exatos, saldo, precisa_documento }'
      security: []
      responses:
        '200':
          description: '{ disponivel, pacotes, exatos, saldo, precisa_documento }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponivel:
                    type: object
                    description: '`false` when the app has no Asaas configured (use the Pix with receipt).'
                  pacotes:
                    type: array
                    items:
                      type: object
                    description: The credit packs (3, 5, 10 or 25 dollars), with `brl_centavos`.
                  exatos:
                    type: array
                    items:
                      type: object
                    description: Prices declared by the app, with `usd` and `brl_centavos`. Amounts start at R$ 5.00 and cannot exceed R$ 10,000.
                  saldo:
                    type: object
                    description: 'When the product sells a balance in reais: the range and whether the account can buy.'
                  precisa_documento:
                    type: object
                    description: Whether the payer's CPF or CNPJ is still required.
                required:
                - disponivel
                - pacotes
                - exatos
                - saldo
                - precisa_documento
      tags:
      - Credito
    post:
      operationId: post_api_credito_asaas
      summary: 'Creates a dynamic Pix: JSON with `oferta` (`pacote` with `usd`, or `saldo` with…'
      description: 'The payment releases what was bought by itself: the pack becomes the `cred_…` token already in the response; the balance goes to the logged-in account''s organization. The first purchase needs `documento` (CPF or CNPJ, sent to the gateway and not stored here) and `nome`; `email`, `pagina` and `navegador_id` are optional. With `forma: "cartao_boleto"` the charge is open: the response brings `pagamento_em`, the gateway page where you pay by card, boleto or Pix (due in three days). With `forma: "cartao"` and `cartao` (`titular`, `numero`, `mes`, `ano`, `cvv`, `documento`, `email`, `cep`, `numero_endereco`, `telefone`), the charge is paid by card in the same request: 200 with `estado: "pago"`, 202 with `conferir` while the issuer reviews it, 422 when the card is declined; the card is not stored. Set `usd` to an amount from `pacotes` or `exatos` in the GET response. The server sets the amount in cents and rejects amounts that the app has not declared.

        Returns: { id, credito, forma, pix, pagamento_em, estado, estado_em, cancelamento }'
      security: []
      responses:
        '200':
          description: '{ id, credito, forma, pix, pagamento_em, estado, estado_em, cancelamento }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Charge id, to follow up.
                  credito:
                    type: string
                    description: 'For a pack: the `cred_…` token, shown ONCE; valid when the payment arrives.'
                  forma:
                    type: string
                    description: '`pix` (the default), `cartao` or `cartao_boleto`.'
                  pix:
                    type: object
                    description: '`copia_e_cola`, `imagem` (PNG QR, data URI) and `expira_em`; `pix` form only.'
                  pagamento_em:
                    type: string
                    description: 'In the `cartao_boleto` form: the gateway payment page.'
                  estado:
                    type: string
                    description: 'In the `cartao` form: `pago`, or `pendente` with `conferir`.'
                  estado_em:
                    type: string
                    description: Where to follow the payment.
                  cancelamento:
                    type: string
                    description: Capability to cancel a pending Pix or boleto charge.
                required:
                - id
                - credito
                - forma
                - pix
                - pagamento_em
                - estado
                - estado_em
                - cancelamento
        '400':
          description: Credit amount outside `pacotes` and `exatos`, amount out of range, invalid CPF/CNPJ, name or e-mail, invalid card data (`cartao_dados`, with the `campo`), or the gateway refused the payer (`pagador_recusado`, with the reason in `detalhe`).
        '422':
          description: Card declined (`cartao_recusado`, with the `campo` when the gateway says which); try another card with `POST /api/credito/asaas/:id/cartao`.
        '429':
          description: Limit of 3 attempts per minute or 10 per day, per account or network, or the card limit.
        '502':
          description: The gateway did not create the Pix; try again.
        '503':
          description: Automatic Pix unavailable in this app, the gateway is busy (`asaas_ocupado`, wait `retry_after_s`), or too many charges from people not signed in waiting for payment.
      tags:
      - Credito
  /api/credito/asaas/{id}:
    get:
      operationId: get_api_credito_asaas_by_id
      summary: 'State of an automatic Pix charge: `pendente`, `pago`, `vencido`, `estornado` or…'
      description: 'Returns: { estado, pago_em }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Charge id (32 hex).
        example: 0123456789abcdef0123456789abcdef
      responses:
        '200':
          description: '{ estado, pago_em }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    description: '`pago` releases the pack token or the balance; a Pix paid after the due date counts.'
                  pago_em:
                    type: string
                    description: When the payment was confirmed, or `null`.
                required:
                - estado
                - pago_em
        '404':
          description: Unknown charge.
      tags:
      - Credito
  /api/credito/asaas/{id}/cartao:
    post:
      operationId: post_api_credito_asaas_by_id_cartao
      summary: 'Pays a card charge whose card was declined with another card: the same charge…'
      description: 'JSON with the `cartao` (the same fields as `POST /api/credito/asaas`) and, without an account, the `navegador_id` that created the charge. Only a card charge waiting for payment, by whoever created it, and up to five attempts per charge.

        Returns: { estado, estado_em }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Id da cobrança (32 hex).
        example: 0123456789abcdef0123456789abcdef
      responses:
        '200':
          description: '{ estado, estado_em }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    description: '`pago`, or `pendente` with `conferir` while the issuer reviews it.'
                  estado_em:
                    type: string
                    description: Where to follow the payment.
                required:
                - estado
                - estado_em
        '400':
          description: Invalid card data (`cartao_dados`, with the `campo`).
        '404':
          description: Unknown charge, someone else's charge, or not a card charge.
        '409':
          description: The charge expired or was closed; start the payment again.
        '422':
          description: Card declined (`cartao_recusado`).
        '429':
          description: Used up the card attempts for this charge or for today.
      tags:
      - Credito
  /api/credito/asaas/saude:
    get:
      operationId: get_api_credito_asaas_saude
      summary: 'Health of this app''s Pix and enabled subscriptions: failures and reasons for…'
      description: 'Returns: { ativo, tarefas }'
      security: []
      responses:
        '200':
          description: '{ ativo, tarefas }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ativo:
                    type: object
                    description: '`false` when Asaas and subscriptions are disabled.'
                  tarefas:
                    type: array
                    items:
                      type: object
                    description: Each problem has `id`, `falhando`, and `motivo`. Includes Pix and, when enabled, subscription recovery, queue, and budget. Does not call the provider.
                required:
                - ativo
                - tarefas
      tags:
      - Credito
components:
  schemas:
    AceiteDeAssinatura:
      type: object
      properties:
        oferta_id:
          type: string
          description: Offer ID from the current catalog.
        versao:
          type: integer
          description: Offer version from the current catalog.
        hash:
          type: string
          description: 64-character hash from the current catalog.
        renovacao:
          type: boolean
          description: Must be true after explicit acceptance of monthly billing and automatic renewal.
      required:
      - oferta_id
      - versao
      - hash
      - renovacao
    RegistroDeAssinatura:
      type: object
      properties:
        recurso:
          type: string
          description: 'Product resource: at most 256 characters, without controls. Empty means an account subscription.'
        id:
          type: string
          description: 'Local subscription ID: 32 lowercase hexadecimal characters. Use it for reads and cancellation.'
        oferta_id:
          type: string
          description: Accepted offer ID.
        oferta:
          allOf:
          - $ref: '#/components/schemas/OfertaDeAssinatura'
          description: Offer saved at acceptance. A catalog change does not replace this record.
        estado:
          type: string
          description: criando, inconclusiva, checkout, aguardando_pagamento, ativa, cancelando, cancelada, falhou or expirada.
        simulado:
          type: boolean
          description: 'Server-recorded environment: true for sandbox, false for production.'
        pagamento_em:
          type: string
          description: Null for API card purchases. Older checkout records can contain an Asaas HTTPS link.
          nullable: true
        criado_em:
          type: string
          description: Subscription creation time in UTC.
        atualizado_em:
          type: string
          description: Last change time in UTC.
        cancelamento_em:
          type: string
          description: Cancellation request time in UTC, or null.
          nullable: true
        cancelado_em:
          type: string
          description: Confirmed cancellation time in UTC, or null.
          nullable: true
      required:
      - recurso
      - id
      - oferta_id
      - oferta
      - estado
      - simulado
      - pagamento_em
      - criado_em
      - atualizado_em
      - cancelamento_em
      - cancelado_em
    BeneficioDeAssinatura:
      type: object
      properties:
        sku:
          type: string
          description: 'Product capability: a lowercase letter followed by letters, digits or underscores; at most 64 characters.'
        quantidade:
          type: integer
          description: 1 to 1,000,000 units for each paid period.
      required:
      - sku
      - quantidade
    CartaoDeAssinatura:
      type: object
      properties:
        titular:
          type: string
          description: 'Name on the card: 3 to 100 characters.'
        numero:
          type: string
          description: 'Valid card number: 13 to 19 digits. Spaces and separators are accepted.'
        mes:
          type: string
          description: 'Expiry month: 1 to 12.'
        ano:
          type: string
          description: Four-digit expiry year. The card must not be expired.
        cvv:
          type: string
          description: 'Security code: three digits, or four for American Express.'
        documento:
          type: string
          description: Cardholder's valid Brazilian CPF or CNPJ.
        email:
          type: string
          description: 'Cardholder''s e-mail: at most 254 characters.'
        cep:
          type: string
          description: 'Cardholder''s Brazilian billing postcode: eight digits.'
        numero_endereco:
          type: string
          description: 'Billing address number: at most 20 characters.'
        telefone:
          type: string
          description: 'Cardholder''s telephone number: 10 to 13 digits.'
      required:
      - titular
      - numero
      - mes
      - ano
      - cvv
      - documento
      - email
      - cep
      - numero_endereco
      - telefone
    OfertaDeAssinatura:
      type: object
      properties:
        id:
          type: string
          description: 'Offer ID: 2 to 64 characters. Start with a lowercase letter. Use lowercase letters, digits, hyphens or underscores.'
        produto:
          type: string
          description: Product ID, with the same format as the offer ID.
        versao:
          type: integer
          description: 'Offer version: 1 to 1,000,000.'
        preco_centavos:
          type: integer
          description: 'Monthly price in cents: 500 to 1,000,000.'
        moeda:
          type: string
          description: 'Fixed currency: BRL.'
        ciclo:
          type: string
          description: 'Fixed billing cycle: MONTHLY.'
        renovacao_automatica:
          type: boolean
          description: 'true: monthly billing continues until cancellation.'
        compromisso_meses:
          type: integer
          description: '1: one monthly period.'
        cancelamento:
          type: string
          description: 'stop_future_charges: stop new charges.'
        acesso_pago:
          type: string
          description: 'until_paid_period_end: keep access until the paid period ends.'
        teste_dias:
          type: integer
          description: 'Configured trial length: 0 to 30 days. Reading the catalog grants no trial or benefit.'
        conversao_teste:
          type: string
          description: 'opt_in: a trial does not create or renew a subscription.'
        beneficios:
          type: array
          items:
            $ref: '#/components/schemas/BeneficioDeAssinatura'
          description: 1 to 8 distinct capabilities for each paid period.
        hash:
          type: string
          description: 'SHA-256 of the complete offer: 64 lowercase hexadecimal characters.'
      required:
      - id
      - produto
      - versao
      - preco_centavos
      - moeda
      - ciclo
      - renovacao_automatica
      - compromisso_meses
      - cancelamento
      - acesso_pago
      - teste_dias
      - conversao_teste
      - beneficios
      - hash
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use an organisation API key (`mmk_…`) for permitted work in that organisation. Account operations require the shared account session. Paid routes accept a global credit token (`cred_…`). Monthly purchases require a recent human session.
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
