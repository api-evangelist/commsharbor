  - Unknown, expired or already used invitation.
- status: 409
  title: Conflict
  occurrences: 18
  semantics:
  - Already launched, marketing paused for the organization, or no eligible recipients.
  - An erasure is already scheduled.
  - Editing content after launch, or resuming while marketing is paused for the organization.
  - Key reused with a different payload, or the recipient is suppressed.
  - Resuming while the risk that caused the pause is still observed.
  - The audience is a saved segment and has no manual membership.
- status: 410
  title: Gone
