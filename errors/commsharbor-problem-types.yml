note: 'Derived from the per-operation 4xx/5xx declarations across 151 operations. No RFC 9457 problem+json envelope;
  errors are status-code plus prose semantics. Notable house rules: another tenant''s ID answers the same 404 as
  a missing record; 409 covers Idempotency-Key payload conflicts and suppressed recipients; 402 is a live x402 payment
  challenge (Base network, USDC) on billing purchases and prepaid credit top-ups; 429 is quota exhaustion against
  the organization entitlement or the global bootstrap cap, not a request-rate limit.'
