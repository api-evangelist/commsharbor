mcp_only: []
rest_only:
- operationId: get_okf_by_arquivo
  method: GET
  path: /okf/{arquivo}
  reason: public OKF markdown bundle
- operationId: get_well_known_by_arquivo
  method: GET
  path: /.well-known/{arquivo}
  reason: public well-known documents
- operationId: get_apis_json
  method: GET
  path: /apis.json
  reason: public APIs.json discovery document
- operationId: get_api
  method: GET
  path: /api/
  reason: public API index; discovery, not a tenant action
- operationId: get_mcp
  method: GET
  path: /mcp
  reason: the MCP server card itself
- operationId: post_api_aws_sns
  method: POST
  path: /api/aws/sns
  reason: Amazon SNS callback; never called by a client
- operationId: post_api_messages
  method: POST
  path: /api/messages
  reason: header-resolved variant of commsharbor_message_send
- operationId: post_api_credito
  method: POST
  path: /api/credito
  reason: x402 prepaid credit top-up; payment flow, not a tool
- operationId: get_api_credito
  method: GET
  path: /api/credito
  reason: prepaid-credit statement; bearer-of-balance token, not an org credential
- operationId: get_api_metrics
  method: GET
  path: /api/metrics
  reason: public operator metrics endpoint
