- name: commsharbor_email_security_check
  description: 'Check whether someone can send email as a domain: SPF, DKIM in common selectors, DMARC,
    MX, MTA-STS and BIMI, with a 0-100 score and the fixes, most severe first. Public DNS only. Free,
    no account. The same domain is served from memory for 10 minutes. A network can run 30 new checks
    per day. DKIM is looked up in common selectors only; `dkim_not_found` does not prove that no key exists.
    `incomplete: true` means a DNS answer failed and the score can be lower than the real one; `unread`
    names those parts, and a failed query never becomes a missing finding.'
